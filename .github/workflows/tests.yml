name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scientific:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install scientific dependencies only
        run: python -m pip install ".[dev]"
      - name: Scientific tools, corpus and validation tests
        run: python -m pytest tests/tools tests/benchmark tests/models tests/test_validation.py -q
      - name: Validate the committed corpus and evidence
        run: python -m astrotoolbench.validate
      - name: Regenerate and validate references in a temporary directory
        run: |
          python -m astrotoolbench.generate_references \
            --output "$RUNNER_TEMP/references.jsonl" \
            --report "$RUNNER_TEMP/reference-verification.json" \
            --splits "$RUNNER_TEMP/splits.json"
          python -m astrotoolbench.validate \
            --tasks "$RUNNER_TEMP/references.jsonl" \
            --specifications tasks/astrodynamics/specifications.jsonl \
            --report "$RUNNER_TEMP/reference-verification.json" \
            --splits "$RUNNER_TEMP/splits.json"
      - name: Run the offline transfer example
        run: python examples/scientific_workflow.py

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev,llm,tokenizer]"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: qwen-tokenizer-7ae557604adf67be50417f59c2c2f167def9a775
      - name: Cache pinned tokenizer assets
        run: >-
          python -c "from atb.template_inspection import load_tokenizer;
          load_tokenizer(revision='7ae557604adf67be50417f59c2c2f167def9a775')"
      - run: python -m pytest -q
      - run: atb-inspect --dry-run --env-file .env.example
      - run: atb-run --help
      - run: >-
          python scripts/inspect_template.py --task period-001 --local-files-only
          --revision 7ae557604adf67be50417f59c2c2f167def9a775
